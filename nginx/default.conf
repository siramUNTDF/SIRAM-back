server {
    listen 80;
    server_name _;
    client_max_body_size 12m;   # adjuntos (certificados, fotos)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /static/ { proxy_pass http://api:8000; }

    # Front React (SPA): cualquier ruta devuelve index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
# HTTPS (RT.08): con certificados disponibles, agregar un server { listen 443 ssl; ... } igual al de arriba
# y redirigir el 80 → 443; luego poner DJANGO_SECURE_SSL=true en .env.
